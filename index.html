<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0c">
<title>FWD</title>
<style>html,body{margin:0;padding:0;background:#0e0e0c;}</style>
<script>
// Redirect mobile before anything else loads
if('ontouchstart' in window && window.innerWidth <= 1024){
  window.location.replace('mobile.html');
}
</script>
</head>
<body>
<script>
// If not redirected (desktop), load full portfolio
if(!('ontouchstart' in window) || window.innerWidth > 1024){
  window.location.replace('desktop.html');
}
</script>
</body>
</html>
