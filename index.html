<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0c">
<title>FWD</title>
<style>html,body{margin:0;padding:0;background:#0e0e0c;}</style>
<script>
(function(){
  if('ontouchstart' in window && window.innerWidth <= 1024){
    document.write('<meta http-equiv="refresh" content="0;url=mobile.html">');
  } else {
    document.write('<meta http-equiv="refresh" content="0;url=desktop.html">');
  }
})();
</script>
</head>
<body style="background:#0e0e0c;margin:0;padding:0;">
</body>
</html>
