<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FORWARD — Portfolio</title>
</head>
<body style="background:#0e0e0c;margin:0;">
  <script>
    fetch('portfolio.pdf')
      .then(function(res){ return res.blob(); })
      .then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'FWD_2026.pdf';
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
          URL.revokeObjectURL(url);
          window.location.href = '/';
        }, 800);
      })
      .catch(function(){ window.location.href = '/'; });
  </script>
</body>
</html>
